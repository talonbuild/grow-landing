    /* Complementary hues: blue 210° + orange 30°, exactly 180° apart. */
    :root{--blue-hue:210;--orange-hue:30;--blue:hsl(var(--blue-hue) 100% 51%);--orange:hsl(var(--orange-hue) 100% 65%);--ink:hsl(var(--blue-hue) 62% 22%);--muted:hsl(var(--blue-hue) 28% 38%);--accent:hsl(var(--orange-hue) 100% 34%);--sky:hsl(var(--blue-hue) 100% 96%)}
    *{box-sizing:border-box}
    html{background:var(--sky);-webkit-text-size-adjust:100%}
    body{margin:0;color:var(--ink);font-family:GrowBody,Arial,sans-serif;-webkit-font-smoothing:antialiased}
    ::selection{background:#ffcf9f;color:var(--ink)}
    .page{position:relative;isolation:isolate;min-height:100vh;min-height:100svh;overflow:hidden;display:flex;flex-direction:column;padding:25px 28px 0;background:radial-gradient(ellipse at 73% 43%,#fff 0,transparent 49%),linear-gradient(140deg,#f1f8ff 0%,#e8f4ff 58%,#d6ebff 100%)}
    .header{width:min(1120px,100%);margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .brand{display:flex;align-items:center;gap:10px;font-family:GrowDisplay,Arial,sans-serif;font-size:24px;font-weight:850;letter-spacing:-1.5px}
    .brand img{width:36px;height:36px;border-radius:10px}
    .header-note{font-size:13px;font-weight:750;color:var(--muted)}
    .hero{width:min(1050px,100%);margin:auto;display:grid;grid-template-columns:1.08fr 1fr;grid-template-areas:"intro art" "download art";align-content:center;align-items:center;column-gap:35px;padding:30px 0 40px}
    .intro{grid-area:intro;align-self:end;position:relative;z-index:1}
    .eyebrow{margin:0 0 23px;color:var(--muted);font-size:11px;letter-spacing:.17em;font-weight:900;text-transform:uppercase}
    h1{font-family:GrowDisplay,Arial,sans-serif;font-weight:850;font-size:clamp(38px,4.6vw,61px);line-height:1.16;letter-spacing:-.055em;margin:0}
    h1 span{display:block;white-space:nowrap}
    h1 em{color:var(--accent);font-style:normal}
    .sub{font-size:19px;line-height:1.5;color:var(--muted);font-weight:650;max-width:360px;margin:23px 0 0}
    .art{grid-area:art;position:relative;width:100%;aspect-ratio:.88;align-self:center;isolation:isolate}
    .sun{position:absolute;z-index:-2;width:91%;aspect-ratio:1;left:7%;top:13%;border-radius:50%;background:var(--orange);box-shadow:0 0 0 18px #ffb36626,0 0 0 39px #ffb36612}
    .ground{position:absolute;z-index:-1;bottom:0%;left:13%;width:85%;height:6%;border-radius:50%;background:#17416b22;filter:blur(10px)}
    .phone{position:absolute;height:95%;aspect-ratio:393/852;left:17%;top:0;transform:rotate(-7deg);border:6px solid #14151a;border-radius:38px;background:#fff;box-shadow:0 0 0 1.5px #8a8e96,3px 2px 0 3px #2d313a,12px 23px 32px #1737522b;overflow:hidden}
    .phone img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
    .mascot{position:absolute;width:83%;max-width:none;height:auto;left:39%;bottom:-7%;filter:drop-shadow(0 12px 9px #1b3b541c);transform-origin:50% 86%;z-index:2}
    .spark{position:absolute;width:31px;height:31px;color:var(--blue)}
    .spark-one{left:1%;top:29%;transform:rotate(-12deg)}
    .spark-two{right:1%;top:7%;width:21px;height:21px;transform:rotate(15deg)}
    .hello{position:absolute;z-index:3;left:4%;bottom:11%;background:#fff;border:1px solid #dae7f2;border-radius:13px 13px 4px 13px;color:var(--ink);font-size:13px;font-weight:900;padding:10px 14px;box-shadow:0 4px 0 #b2cee94a;transform:rotate(-7deg)}
    .download{grid-area:download;align-self:start;margin-top:29px;position:relative;z-index:4;width:210px;text-align:center}
    .store-button{display:inline-block;width:180px;height:auto;min-height:44px;border-radius:10px;line-height:0;text-decoration:none;transition:transform .18s ease,filter .18s ease;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    .store-button img{display:block;width:100%;height:auto}
    .store-button:focus-visible{outline:3px solid var(--blue);outline-offset:6px}
    .store-button:active{transform:scale(.97)}
    .download-note{margin:13px 0 0;color:var(--muted);font-size:11px;line-height:1.5;font-weight:650}
    .footer{width:min(1120px,100%);margin:0 auto;min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:10px;font-weight:650;padding-bottom:env(safe-area-inset-bottom,0px)}
    .footer p{margin:0}.footer nav{display:flex;gap:7px}
    .footer a{color:inherit;text-decoration:none;min-height:44px;display:inline-flex;align-items:center;padding:0 7px;border-radius:5px}
    .footer a:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
    @media(hover:hover){.store-button:hover{transform:translateY(-2px);filter:drop-shadow(0 4px 5px #15365526)}.footer a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}}
    @media(prefers-reduced-motion:no-preference){.mascot{animation:hello .8s ease-out both}@keyframes hello{from{opacity:0;transform:translateY(8px) rotate(-3deg)}to{opacity:1;transform:translateY(0) rotate(0)}}}
    @media(min-width:701px) and (max-width:1000px){.mascot{left:27%}}
    @media(max-width:700px){
      .page{padding:17px 22px 0;background:radial-gradient(ellipse at 50% 47%,#fff 0,transparent 57%),linear-gradient(#edf6ff,#e1f0ff)}
      .header{justify-content:center}.brand{font-size:22px;gap:8px}.brand img{width:30px;height:30px;border-radius:8px}.header-note{display:none}
      .hero{max-width:430px;grid-template-columns:1fr;grid-template-areas:"intro" "art" "download";text-align:center;padding:21px 0 8px;column-gap:0}
      .eyebrow{font-size:9px;letter-spacing:.15em;margin-bottom:12px}
      h1{font-size:clamp(28px,8.7vw,39px);line-height:1.2}
      .sub{font-size:15px;line-height:1.4;max-width:290px;margin:12px auto 0}
      .art{height:clamp(215px,40svh,350px);width:auto;aspect-ratio:1.03;justify-self:center;margin:18px 0 5px}
      .phone{left:18%;height:95%;border-width:4px;border-radius:23px;box-shadow:0 0 0 1px #8a8e96,2px 1px 0 2px #2d313a,8px 14px 20px #17375226}
      .sun{width:88%;left:9%;top:7%;box-shadow:0 0 0 11px #ffb36626,0 0 0 24px #ffb36612}
      .mascot{width:76%;left:39%;bottom:-4%}
      .spark-one{width:22px;height:22px;left:0%;top:24%}.spark-two{width:15px;height:15px;right:0%;top:3%}
      .hello{font-size:10px;padding:7px 10px;left:0%;bottom:10%;border-radius:10px 10px 3px 10px}
      .download{width:220px;justify-self:center;margin-top:9px}.store-button{width:168px;border-radius:9px}.download-note{margin-top:10px;font-size:10px}
      .footer{justify-content:center;flex-wrap:wrap;gap:0 8px;min-height:45px;font-size:9px;padding-bottom:max(3px,env(safe-area-inset-bottom))}.footer nav{gap:0}.footer a{padding:0 6px}
    }
    @media(max-width:700px) and (max-height:680px){.page{padding-top:12px}.hero{padding-top:15px;padding-bottom:4px}.eyebrow{margin-bottom:8px;font-size:8px}.sub{margin-top:9px;font-size:14px}.art{height:clamp(180px,35svh,235px);margin-top:13px;margin-bottom:4px}.brand{font-size:20px}.brand img{width:27px;height:27px}.download{margin-top:6px}.download-note{margin-top:8px}.store-button{width:159px}.footer{min-height:44px}}
    @media(max-width:350px){.page{padding-left:16px;padding-right:16px}.eyebrow{letter-spacing:.1em}.sub{font-size:13px}.footer{font-size:9px;gap:2px}}
    @media(min-width:701px) and (max-height:500px){
      .page{padding-top:13px}.brand{font-size:20px}.brand img{width:28px;height:28px;border-radius:8px}.header-note{font-size:11px}
      .hero{padding:12px 0 13px;column-gap:20px}.eyebrow{font-size:9px;margin-bottom:9px}h1{font-size:32px;line-height:1.16}.sub{font-size:14px;line-height:1.35;margin-top:10px}
      .art{width:240px;height:260px;justify-self:center}.phone{border-width:4px;border-radius:22px}.sun{box-shadow:0 0 0 10px #ffb36626,0 0 0 20px #ffb36612}.hello{font-size:10px;padding:7px 10px}.spark-one{width:20px;height:20px}
      .download{margin-top:16px;width:180px}.store-button{width:159px}.download-note{font-size:9px;margin-top:8px}.footer{min-height:44px;font-size:10px}
    }
  </style>

<body>
